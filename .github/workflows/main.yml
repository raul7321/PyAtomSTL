name: Compile JOSS Paper
on: [push, pull_request]

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Paper PDF
        uses: openjournals/openjournals-action@main
        with:
          journal: joss
